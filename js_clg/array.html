<html>

<head>
	<script>
		function fun() {
			var d = [];
			var d1 = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
			document.writeln(d);
			document.writeln(d1);

			document.writeln(d.length);
			document.writeln(d1.length);
			d1.length = 7;
			document.writeln(d1);
			document.writeln(d1.at(0));
			document.writeln(d1.at(-1));

			var d2 = ["oop", "c++", "java", "python"];
			d2.sort();
			document.writeln(d2);
			// to sort the numeric array, pass a callback function in sort method.
			// there are two arguments in the callback function; a and b
			
		}
	</script>

</head>

<body>
	<script>
		fun();
	</script>
</body>

</html>
