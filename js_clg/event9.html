<html>

<head>
	<script>
		function fun() {
			var x = Math.floor(Math.random() * 400);
			var y = Math.floor(Math.random() * 400);
				

			button.style.left = x + "px";
			button.style.top = y + "px";
			button.style.position = "absolute";
		}
	</script>
</head>

<body>
	<button id="button" onmouseover="fun()">Click me if you can</button>
</body>

</html>
