<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Password Validation</title>
</head>

<body>

	<form name="f1" novalidate>
		<label>Password:
			<input type="password" name="p">
		</label>

		<label>
			<input type="checkbox" name="ck"> Show password
		</label>

		<br><br>
		<input type="submit" value="Submit">
	</form>

	<script>

		document.f1.ck.onchange = function () {
			document.f1.p.type = this.checked ? "text" : "password";
		}

		document.f1.onsubmit = function () {
			var patt = /[0-9a-zA-Z]{6,12}/;

			if (this.p.value == "") {
				alert("Enter password");
				this.p.focus();
				return false;
			}
			else if (!patt.test(this.p.value)) {
				alert("Enter valid password )");
				this.p.focus();
				return false;
			}
		}

	</script>

</body>

</html>
