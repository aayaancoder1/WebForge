<html>

<head></head>

<body>
	<form name="f1">
		<label>Password: <input type="password" name="p1"></label><br>
		<label>Confirm Password: <input type="password" name="p2"></label><br>
		<button type="submit">Submit</button>

		<script>
			document.f1.onsubmit = function () {
				// Changed " " to "" to catch empty submissions
				if (this.p1.value == "") {
					alert("Enter the password");
					this.p1.focus();
					return false;
				}
				else if (this.p2.value == "") {
					alert("Confirm your password");
					this.p2.focus();
					return false;
				}
				else if (this.p1.value != this.p2.value) {
					alert("Passwords are not Matching");
					this.p1.focus();
					return false;
				}
				else {
					alert("OK");
					return true;
				}
			}
		</script>
	</form>
</body>

</html>
